# Reads the market every five minutes and publishes the result to the `data`
# branch, where the website fetches it. Free on a public repository.
#
# GitHub starts scheduled runs late when it is busy and sometimes skips one,
# so readings are typically 5-15 minutes apart. The website shows the age of
# its data and says so when the collector is late.
name: Collect market data

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the previous state from the data branch
        run: |
          mkdir -p .data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C .data
            echo "restored state from the data branch"
          else
            echo "no data branch yet: this is the first run"
          fi

      - name: Read the market and score it
        run: pnpm collect
        env:
          FLOWSTATE_DATA_DIR: .data

      - name: Publish to the data branch
        if: always()
        run: |
          if [ -f .data/state.json ]; then
            scripts/publish-data.sh .data data origin
          else
            echo "nothing was produced; the data branch is left as it was"
          fi
